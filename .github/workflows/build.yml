name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # for publishing releases on tags

jobs:
  macos:
    runs-on: macos-14          # Apple Silicon (arm64)
    env:
      PYVER: "3.12.10"
    steps:
      - uses: actions/checkout@v4

      # python.org build: bundles Tcl/Tk 8.6 (Aqua) inside the framework, which
      # PyInstaller can ship inside the .app without Homebrew dependencies
      - name: Install Python from python.org
        run: |
          curl -sSLo python.pkg "https://www.python.org/ftp/python/${PYVER}/python-${PYVER}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          $PY -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install numpy sounddevice pyinstaller pillow
          .venv/bin/python -c "import tkinter, numpy, sounddevice; print('Tk', tkinter.TkVersion)"

      - name: Smoke test (zh_CN)
        timeout-minutes: 8
        run: .venv/bin/python -u tests/smoke_test.py zh_CN

      - name: Smoke test (ja)
        timeout-minutes: 8
        run: .venv/bin/python -u tests/smoke_test.py ja

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-screenshots
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Build OREMO.app
        run: |
          .venv/bin/pyinstaller oremo-mac.spec --noconfirm
          file dist/OREMO.app/Contents/MacOS/OREMO
          codesign --force --deep --sign - dist/OREMO.app
          codesign --verify --verbose dist/OREMO.app

      - name: Launch test of the built app
        run: |
          dist/OREMO.app/Contents/MacOS/OREMO > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "OREMO is running"; kill $PID
          else
            echo "OREMO exited early"; cat launch.log; exit 1
          fi
          cat launch.log

      - name: Make DMG
        run: |
          mkdir -p dmg
          cp -R dist/OREMO.app dmg/
          cp "packaging/mac/使用说明-Mac.txt" dmg/
          cp LICENSE dmg/LICENSE.txt
          ln -s /Applications dmg/Applications
          hdiutil create -volname "OREMO" -srcfolder dmg -ov -format UDZO OREMO-mac-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OREMO-mac-arm64
          path: OREMO-mac-arm64.dmg

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" OREMO-mac-arm64.dmg --clobber || gh release create "$GITHUB_REF_NAME" OREMO-mac-arm64.dmg --title "$GITHUB_REF_NAME" --notes "OREMO Unicode edition"

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sounddevice
      - name: Smoke test
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke_test.py zh_CN

  # Report-only Defender scan of the published U1 package and a fresh build
  # (a user reported Trojan:Win32/Bearfoos.B!ml on U1's oremo.exe).
  # Samples are never uploaded and nothing is quarantined.
  windows-av-scan:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Defender (cloud lookup on, sample upload off)
        shell: pwsh
        run: |
          Set-MpPreference -SubmitSamplesConsent 2 -MAPSReporting 2
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AMProductVersion,AntivirusSignatureVersion | Format-List
          Get-MpPreference | Select-Object MAPSReporting,SubmitSamplesConsent,CloudBlockLevel | Format-List

      - name: Fetch U1 release and build current source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.0-U1 -p "OREMO-Unicode-3.0-U1-windows-x64.zip" -D scan
          Expand-Archive scan/OREMO-Unicode-3.0-U1-windows-x64.zip scan/u1
          pip install numpy sounddevice pyinstaller
          pyinstaller oremo.spec --noconfirm
          New-Item -ItemType Directory scan/fresh | Out-Null
          Copy-Item dist/OREMO scan/fresh -Recurse

      - name: Scan (no remediation)
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          Get-ChildItem scan -Recurse -Include *.exe,*.dll,*.pyd | ForEach-Object {
            $h = (Get-FileHash $_.FullName).Hash.Substring(0,16)
            $out = & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation 2>&1 | Out-String
            $hit = if ($LASTEXITCODE -eq 2) { "THREAT" } elseif ($LASTEXITCODE -eq 0) { "clean" } else { "exit $LASTEXITCODE" }
            "{0,-8} {1} {2} {3}" -f $hit, $h, $_.Length, $_.FullName
            if ($LASTEXITCODE -eq 2) { $out }
          }
          Get-MpThreatDetection | Format-List
